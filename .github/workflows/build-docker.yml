# 自定义 Docker 镜像构建工作流（空回复检测补丁专用）
# 与原仓库 release.yaml 的区别：
#   1. 只构建 linux/amd64 单平台（NAS 用，省一半以上时间）
#   2. 只推送 ghcr.io，使用自带 GITHUB_TOKEN，无需配置任何 secrets
#   3. 不上传 Release（fork 没有 tags，原流程会失败）
name: build-docker

on:
  push:
    branches:
      - master
  workflow_dispatch:   # 支持在 Actions 页面手动触发

permissions:
  contents: read
  packages: write      # 推送 ghcr.io 镜像需要

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 拉全历史，build.sh 里 git describe 取版本号用

      - name: Fetch tags
        run: git fetch --tags --force || echo "no tags in fork, version will be dev"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # 单平台构建（含前端 pnpm build + 价格数据更新 + Go 编译）
      - name: Build linux/amd64 binary
        run: bash scripts/build.sh build linux x86_64

      # Dockerfile.debian 只负责 COPY 二进制进镜像，需要按它的目录约定摆好文件
      - name: Prepare docker binary layout
        run: |
          mkdir -p build/docker/linux/amd64
          cp build/bin/octopus-linux-x86_64 build/docker/linux/amd64/octopus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 固定，便于 NAS 侧 digest 锁定；改代码后手动改这个版本号再 push
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ghcr.io/namebao18/octopus:v0.9.28-emptyfix.1
