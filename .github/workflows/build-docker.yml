# 自定义 Docker 镜像构建工作流（空回复检测补丁专用）
# 与原仓库 release.yaml 的区别：
#   1. 只构建 linux/amd64 单平台（NAS 用，省一半以上时间）
#   2. 只推送 ghcr.io，使用自带 GITHUB_TOKEN，无需配置任何 secrets
#   3. 不跑 scripts/updatePrice.py——该脚本从 models.dev 重新生成价格表，
#      今日数据含重复模型名会生成非法 Go 代码(duplicate key)，且价格仅用于成本展示，
#      跳过后使用 v0.9.28 仓库自带的 presets.go，无任何功能影响
name: build-docker

on:
  push:
    branches:
      - v0.9.28-patch   # 补丁专用分支（基于 v0.9.28 tag 的 commit）
  workflow_dispatch:   # 支持在 Actions 页面手动触发

permissions:
  contents: read
  packages: write      # 推送 ghcr.io 镜像需要

jobs:
  build:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: v0.9.28-patch   # 构建补丁分支
          fetch-depth: 0       # 拉全历史和 tags，供版本号注入

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 'latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      # 等效 build.sh 的前端步骤：构建 Next.js 并输出到 static/out（嵌入 Go 二进制）
      # 注入版本号与仓库地址，否则前端 APP_VERSION=unknown 与后端版本不一致，触发"版本不匹配"警告
      - name: Build frontend
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo dev)
          cd web
          NEXT_PUBLIC_APP_VERSION="$VERSION" NEXT_PUBLIC_GITHUB_REPO="https://github.com/namebao18/octopus" pnpm install && NEXT_PUBLIC_APP_VERSION="$VERSION" NEXT_PUBLIC_GITHUB_REPO="https://github.com/namebao18/octopus" pnpm run build
          cd ..
          rm -rf static/out
          mv web/out static/

      # 等效 build.sh 的 Go 编译步骤；跳过 updatePrice.py 规避其动态生成代码的重复 key bug
      - name: Build linux/amd64 binary
        run: |
          VERSION=$(git describe --tags --abbrev=0 || echo dev)
          BUILD_TIME=$(TZ='Asia/Shanghai' date +'%F %T %z')
          COMMIT=$(git rev-parse --short HEAD)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build \
            -o build/bin/octopus-linux-x86_64 \
            -ldflags="-X 'github.com/bestruirui/octopus/internal/conf.Version=${VERSION}' -X 'github.com/bestruirui/octopus/internal/conf.BuildTime=${BUILD_TIME}' -X 'github.com/bestruirui/octopus/internal/conf.Author=bestrui' -X 'github.com/bestruirui/octopus/internal/conf.Commit=${COMMIT}' -s -w" \
            -tags=jsoniter .

      # 按 Dockerfile.debian 的约定摆放二进制
      - name: Prepare docker binary layout
        run: |
          mkdir -p build/docker/linux/amd64
          cp build/bin/octopus-linux-x86_64 build/docker/linux/amd64/octopus

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 镜像 tag 固定，便于 NAS 侧 digest 锁定；改代码后手动改这个版本号再 push
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./scripts/dockerfiles/Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ghcr.io/namebao18/octopus:v0.9.28-emptyfix.3
